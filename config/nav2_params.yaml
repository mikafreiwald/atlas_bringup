
bt_navigator:
  ros__parameters:
    global_frame: atlas/map
    robot_base_frame: atlas/base_link
    odom_topic: scan_matching_odometry/odom
    bt_loop_duration: 500 # Duration (in milliseconds) for each iteration of BT execution.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    goal_reached_tol: 1.5 # TODO: right node??
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: true
      groot_server_port: 55555
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    plugin_lib_names:
      - nav2_rge_bt_nodes
      - frontiers_nav2_plugins_bt_nodes

    # jazzy
    # error_code_names:
    #  - compute_path_error_code
    #  - follow_path_error_code

    # kilted
    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - route
      - spin
      - smoother
      - undock_robot
      - wait

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["MPPIController", "RegulatedPurePursuitController"]
    use_realtime_priority: false
    odom_topic: scan_matching_odometry/odom
    enable_stamped_cmd_vel: false # for jazzy

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.7 # Tolerance to meet goal completion criteria (m)
      yaw_goal_tolerance: 6.0 # Tolerance to meet goal completion criteria (rad)
    TebLocalPlanner:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      odom_topic: scan_matching_odometry/odom
      map_frame: atlas/map
      max_global_plan_lookahead_dist: -1.0
      min_obstacle_dist: 0.8
      inflation_dist: 0.9
      dynamic_obstacle_inflation_dist: 0.9
      max_vel_x: 0.6
      acc_lim_x: 0.8
    RegulatedPurePursuitController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 2.0
      min_lookahead_dist: 1.0
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      stateful: true
    MPPIController:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 100
      model_dt: 0.05
      batch_size: 1000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.5
      vy_std: 0.5
      wz_std: 0.6
      vx_max: 1.0
      vx_min: -0.5
      vy_max: 1.0
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 5.0
      max_robot_pose_search_dist: 5.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      publish_optimal_trajectory: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: [
        "ConstraintCritic", "CostCritic", "PreferForwardCritic",
        "PathFollowCritic", "PathAlignCritic", "PathAngleCritic",
        "GoalCritic"
      ]
      ObstacleCritic:
        enabled: true
        cost_power: 1
        critical_weight: 20.0 # Weight to apply to critic for near collisions closer than collision_margin_distance
        repulsion_weight: 1.0 # Weight to apply to critic for generally preferring routes in lower cost space.
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic: # incentivizes navigating spatially towards the goal when in reasonable proximity to goal
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.5 # Minimal distance (m) between robot and goal above which goal distance cost considered
      GoalAngleCritic: #  incentivizes navigating to achieve the angle of the goal posewhen in reasonable proximity to goal
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0 # Minimal distance (m) between robot and goal above which angle goal cost considered
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 300.0
        consider_footprint: false # nedds robot footprint if enabled
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.1
        trajectory_point_step: 4
        threshold_to_consider: 2.5
        offset_from_furthest: 4
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 10
        threshold_to_consider: 2.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 2.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: atlas/odom # atlas/map
      robot_base_frame: atlas/base_link
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.1
      robot_radius: 0.3
      plugins: ["elevation_layer", "inflation_layer"]
      elevation_layer:
        plugin: "nav2_rge::ElevationLayer"
        map_topic: /atlas/local_occupancy_grid_map # Node has namespace /atlas/local_costmap
        clear_costmap_service: /atlas/clear_costmap # Node has namespace /atlas/local_costmap
        fill_radius: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: velodyne_points
          max_obstacle_height: 3.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 3.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: velodyne_points
          max_obstacle_height: 3.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 9.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: atlas/map
      robot_base_frame: atlas/base_link
      robot_radius: 0.3
      resolution: 0.2
      track_unknown_space: true
      plugins: ["elevation_layer"]
        # for vamex module fus: ["elevation_layer"]
      elevation_layer:
        plugin: "nav2_rge::ElevationLayer"
        map_topic: /fus/global_map_cost
        resize_parent: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: velodyne_points
          max_obstacle_height: 3.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map
        subscribe_to_updates: True
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2
    planner_plugins: ["NavfnPlanner"]
    costmap_update_timeout: 1.0
    NavfnPlanner:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
    DfkiPlanner:
      plugin: "nav2_rge::DfkiPlanner"
      plan_service: plan
      do_straight_line: false
      goal_z_offset: 1.0

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false # for jazzy
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: scan_matching_odometry/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false # for jazzy
